robot_types:
  cf21:
    firmware_params:
      su_wrench:
        mass: 0.047000  # observer mass model [kg]
        comOffX: 0.000097  # body-frame CoM offset x [m]
        comOffY: 0.000548  # body-frame CoM offset y [m]
        comOffZ: 0.0  # body-frame CoM offset z [m]
        rOffX: 0.09
        rOffY: 0.0
        rOffZ: 0.035

      su_position:
        traj1Shape: 1  # 0=None, 1=Circle, 2=Square
        traj1SizeX: 0.35  # y-axis radius/side length [m]
        traj1SizeY: 0.0  # z-axis radius/side length [m]
        traj1Period: 40.0  # [s]

        preloadEn: 1  # 0: velocity-mode yaw follows server command, 1: velocity-mode yaw aligns to estimated normal direction
        preloadGf: 15.0  # effective gain from normal force error to normal velocity command
        preloadGv: 5.0  # effective gain from normal velocity leakage to command
        preloadNu: 0.3  # [m/s], symmetric saturation bound for normal velocity command

        alphaMin: 0.1  # [0..1], minimum alpha_frame for tangential velocity command gating
        alphaBar: -0.007  # [+] omega_n bar, [-] normal_velocity_leakage bar, 0 disables alpha_frame gating

        normBeta: 1.5  # [1/s] beta ≈ 2*pi*f_c, decay rate of the normal-axis memory matrix
        normEpsG: 100.0004  # [m^2/s^2], velocity-projection regularization epsilon_g
        normEpsF: 100.015  # [N], minimum force evidence norm epsilon_f

        epsilonFMin: 1.01  # [N], yaw-alignment smoothing starts when |F_xy| exceeds this
        epsilonFMax: 2.025  # [N], yaw-alignment reaches full weight when |F_xy| exceeds this
shared_defaults:
  command_reference: end_effector
