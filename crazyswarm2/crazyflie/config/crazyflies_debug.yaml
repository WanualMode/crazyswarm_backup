# named list of all robots
robots:
  cf2:
    enabled: true
    uri: radio://0/100/1M/E7E7E7E7B6 # first
    # uri: radio://0/80/2M/E7E7E7E7B5 # second
#    uri: udp://0.0.0.0:19850 # simul
    initial_position: [0.0, 0.0, 0.0]
    type: cf21  # see robot_types

# Definition of the various robot types
robot_types:
  cf21:
    big_quad: false
    motion_capture:
      enabled: true  # 원래는 true
      # only if enabled; see motion_capture.yaml
      marker: default_single_marker
      dynamics: default
    firmware_logging:
      enabled: true
      default_topics:
        pose:
          frequency: 20
        status:
          frequency: 1
      custom_topics:
        # Per-motor thrust estimate used for unit checks.
        cf_su_motor_thrust:
          frequency: 20
          vars: [suWrenchObs.f1, suWrenchObs.f2, suWrenchObs.f3, suWrenchObs.f4]
        # Body-frame input torque used for CoM hover calibration.
        cf_su_body_torque:
          frequency: 20
          vars: [suWrenchObs.tauInBx, suWrenchObs.tauInBy, suWrenchObs.tauInBz]
        # Velocity from firmware stateEstimate + position differentiation helper.
        cf_su_vel_pair:
          frequency: 20
          vars: [suWrenchObs.stateVx, suWrenchObs.stateVy, suWrenchObs.stateVz, suWrenchObs.posVx, suWrenchObs.posVy, suWrenchObs.posVz]
        # Raw body-frame acceleration + raw gyro input.
        cf_imu_raw_pair:
          frequency: 20
          vars: [acc.x, acc.y, acc.z, gyro.x, gyro.y, gyro.z]
        cf_su_acc_normal:
          frequency: 20
          vars: [suWrenchObs.accWx, suWrenchObs.accWy, suWrenchObs.accWz, suPosRef.nEstX, suPosRef.nEstY, suPosRef.nEstZ]
        cf_su_normal_debug:
          frequency: 20
          vars: [suPosRef.nPreX, suPosRef.nPreY, suPosRef.nPreZ, suPosRef.nPostX, suPosRef.nPostY, suPosRef.nPostZ]
        # Flying Pen force pipeline. Keep each block within the Crazyflie log packet limit.
        cf_mob_raw:
          frequency: 20
          vars: [suWrenchObs.fHatWx, suWrenchObs.fHatWy, suWrenchObs.fHatWz, suWrenchObs.tauLWx, suWrenchObs.tauLWy, suWrenchObs.tauLWz]
        cf_contact_force:
          frequency: 20
          vars: [suThrustEff.corrFx, suThrustEff.corrFy, suThrustEff.corrFz, suThrustEff.etaHat]
        # cf_su_normal_metrics:
        #   frequency: 20
        #   vars: [suPosRef.vEeX, suPosRef.vEeY, suPosRef.vEeZ, suPosRef.omgN, suPosRef.nVelLeak]
        # cf_su_alpha_frame:
        #   frequency: 20
        #   vars: [suPosRef.alphaFrm, suPosRef.t1CmdDes, suPosRef.t2CmdDes]
        vel_att_des:
          frequency: 10
          vars: [posCtl.targetVX, posCtl.targetVY, posCtl.targetVZ, controller.roll, controller.pitch, controller.yaw]
        cf_ctrl_misc:
          frequency: 10
          vars: [pm.vbat, ctrltarget.x, ctrltarget.y, ctrltarget.z]
        cf_stabilizer_timing:
          frequency: 20
          vars: [stabilizer.loopDtUs, stabilizer.loopDtUsMax]
#         # Desired translational velocity from the position controller.


    firmware_params:
      commander:
        enHighLevel: 1
      stabilizer:  # 제어기랑 상태관측기 고를 수 있음
        estimator: 2  # 1: complementary, 2: kalman
        controller: 1  # 1: PID, 2: mellinger, 3: INDI, 4: Brescianini, 5: Lee
      locSrv:
        extPosStdDev: 1e-3
        extQuatStdDev: 0.5e-1
      imu_sensors:
        accTrimRoll: -0.32
        accTrimPitch: -0.05


      kalman:
        resetEstimation: 0
        # 0: Kalman attitude 사용 (기존과 동일)
        # 1: complementary attitude로 stateEstimate.* (roll/pitch/yaw, q, vel, acc) 출력
        # 2: complementary attitude로 stateEstimate.* 근데이제 yaw는 kalman
        useCompAttOut: 2

        # 0: Kalman 내부 q/R는 원래대로 두고, 출력만 complementary 사용
        # 1: Kalman 내부 q/R도 complementary에 동기화 (내부 dynamics도 comp 기반)
        slaveAttToComp: 0

        # complementary Mahony filter roll/pitch correction gain
        compKp: 1.2
        compKi: 0.0



##### controller: 1 PID #####
      # PID cascade:
      # posCtlPid -> desired velocity
      # velCtlPid -> desired roll/pitch + thrust
      # pid_attitude -> desired body rates
      # pid_rate -> final roll/pitch/yaw actuator command
      #
      # LPF logic:
      # - Crazyflie PID D-term uses derivative of measured signal, not error.
      # - When *FiltEn = 1, a 2-pole low-pass filter attenuates high-frequency noise before D contributes.
      # - Position/velocity filters default ON. Attitude/rate filters default OFF on cf21bl.
      # - Feedforward term is added as outFF = kff * desired.
      posCtlPid:
        xKp: 1.3 # Default: 2.0
        yKp: 1.3 # Default: 2.0
        zKp: 2.2 # Default: 2.0
        xKi: 0.0 # Default: 0.0
        yKi: 0.0 # Default: 0.0
        zKi: 0.0 # Default: 0.5
        xKd: 0.15 # Default: 0.0
        yKd: 0.15 # Default: 0.0
        zKd: 0.25 # Default: 0.0
        xKff: 0.0 # Default: 0.0
        yKff: 0.0 # Default: 0.0
        zKff: 0.0 # Default: 0.0
        posFiltEn: 1 # Default: 1, XY position PID D-term LPF enable
        posFiltCut: 20.0 # Default: 20.0 Hz, XY position PID D-term LPF cutoff
        posZFiltEn: 1 # Default: 1, Z position PID D-term LPF enable
        posZFiltCut: 20.0 # Default: 20.0 Hz, Z position PID D-term LPF cutoff
      velCtlPid:
        vxKp: 15.0 # Default: 25.0
        vyKp: 15.0 # Default: 25.0
        vzKp: 20.0 # Default: 25.0
        vxKi: 0. # Default: 1.0
        vyKi: 0. # Default: 1.0
        vzKi: 7.0 # Default: 15.0
        vxKd: 1.2 # Default: 0.0
        vyKd: 1.2 # Default: 0.0
        vzKd: 2.0 # Default: 0.0
        vxKFF: 0.0 # Default: 0.0
        vyKFF: 0.0 # Default: 0.0
        vzKFF: 0.0 # Default: 0.0
        velFiltEn: 1 # Default: 1, XY velocity PID D-term LPF enable
        velFiltCut: 20.0 # Default: 20.0 Hz, XY velocity PID D-term LPF cutoff
        velZFiltEn: 1 # Default: 1, Z velocity PID D-term LPF enable
        velZFiltCut: 20.0 # Default: 20.0 Hz, Z velocity PID D-term LPF cutoff
        frameMode: 1 # 0: default yaw-aligned body frame, 1: world-frame position/velocity PID

      pid_attitude:
        roll_kp: 6.5 # Default: 6.0
        pitch_kp: 6.5 # Default: 6.0
        yaw_kp: 12.5 # Default: 6.0
        roll_ki: 2.0 # Default: 3.0
        pitch_ki: 2.0 # Default: 3.0
        yaw_ki: 0.7 # Default: 1.0
        roll_kd: 0.3 # Default: 0.0
        pitch_kd: 0.3 # Default: 0.0
        yaw_kd: 1.0 # Default: 0.35
        roll_kff: 0.0 # Default: 0.0
        pitch_kff: 0.0 # Default: 0.0
        yaw_kff: 0.0 # Default: 0.0
        attFiltEn: 1 # Default: 0, attitude PID D-term LPF enable
        attFiltCut: 15.0 # Default: 15.0 Hz, attitude PID D-term LPF cutoff
      pid_rate:
        roll_kp: 220.0 # Default: 200.0
        pitch_kp: 220.0 # Default: 200.0
        yaw_kp: 300.0 # Default: 120.0
        roll_ki: 300.0 # Default: 400.0
        pitch_ki: 300.0 # Default: 400.0
        yaw_ki: 15.0 # Default: 16.7
        roll_kd: 2.5 # Default: 2.5
        pitch_kd: 2.5 # Default: 2.5
        yaw_kd: 3.5 # Default: 0.0
        roll_kff: 0.0 # Default: 0.0
        pitch_kff: 0.0 # Default: 0.0
        yaw_kff: 0.0 # Default: 0.0
        rateFiltEn: 1 # Default: 0, rate PID D-term LPF enable
        omxFiltCut: 30.0 # Default: 30.0 Hz, roll-rate PID D-term LPF cutoff
        omyFiltCut: 30.0 # Default: 30.0 Hz, pitch-rate PID D-term LPF cutoff
        omzFiltCut: 30.0 # Default: 30.0 Hz, yaw-rate PID D-term LPF cutoff
        
    broadcasts:
      num_repeats: 1 # number of times broadcast commands are repeated
      delay_between_repeats_ms: 1 # delay in milliseconds between individual repeats
